<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Minha Pokédex</h1>
    <nav>
      <a href="index.html" class="ativo">Ver Pokédex</a>
      <a href="cadastro.html">Cadastrar Pokémon</a>
      <a href="meus.html">Meus Pokémon</a>
    </nav>
  </header>

  <!-- SEÇÃO TOP 5 -->
  <section class="top5-container">
    <h2 class="top5-titulo">🏆 Top 5 Mais Fortes</h2>
    <div class="top5-lista" id="top5-lista">
      <div class="top5-vazio">Nenhum Pokémon cadastrado ainda.</div>
    </div>
  </section>

  <!-- SEÇÃO POKÉDEX -->
  <section class="pokedex-container">
    <h2 class="pokedex-titulo">Todos os Pokémons</h2>

    <div class="controles">
      <input type="text" id="busca" placeholder="Buscar Pokémon pelo nome...">
    </div>

    <main id="lista"></main>

  </section>

  <div id="detalhe" onclick="fecharDetalhe()">
    <div id="detalhe-conteudo" onclick="event.stopPropagation()">
      <button onclick="fecharDetalhe()" style="float:right; border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
    </div>
  </div>

  <script src="comum.js"></script>
  <script src="script.js"></script>

</body>

</html>
