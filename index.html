<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Minha Pokédex</h1>
    <p>Sua coleção pessoal de Pokémons</p>
  </header>

  <div class="controles">
    <input type="text" id="busca" placeholder="Buscar Pokémon...">
    <div class="filtros">
      <button onclick="filtrar('todos')">Todos</button>
      <button onclick="filtrar('Electric')">Elétrico</button>
      <button onclick="filtrar('Fire')">Fogo</button>
      <button onclick="filtrar('Water')">Água</button>
      <button onclick="filtrar('Flying')">Voador</button>
      <button onclick="filtrar('Normal')">Normal</button>
    </div>
  </div>

  <main id="lista"></main>

  <div id="detalhe" onclick="fecharDetalhe()">
    <div id="detalhe-conteudo" onclick="event.stopPropagation()">
      <button onclick="fecharDetalhe()" style="float:right; border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
    </div>
  </div>

  <script src="script.js"></script>

</body>

</html>
